    - role: prince
      become: true
      tags: prince
    # - role: obsidian
    #   tags: obsidian
    - role: n8n
      tags: n8n

- hosts: tavern
  roles:
    - role: data
      become: true
      tags: data

- hosts: overflow
  roles:
