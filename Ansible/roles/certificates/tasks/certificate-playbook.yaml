- name: Ensure python3-debian is installed for deb822_repository
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Remove legacy Smallstep apt repository file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/smallstep.list
    state: absent

- name: Add Smallstep apt repository
  ansible.builtin.deb822_repository:
    name: smallstep
    types: [deb]
    uris: https://packages.smallstep.com/stable/debian
    suites: [debs]
    components: [main]
    signed_by: https://packages.smallstep.com/keys/apt/repo-signing-key.gpg
    state: present

- name: Ensure step-cli and dependencies are installed
  ansible.builtin.apt:
    name:
      - step-cli
      - wget
      - curl
    state: present
    update_cache: true

- name: Check if Step CA is already bootstrapped
  ansible.builtin.stat:
    path: /root/.step/config/defaults.json
  register: ca_config_stat

- name: Ensure Step CA is Boostrapped
  ansible.builtin.command: >
    step ca bootstrap
    --ca-url https://{{ certificates_ca_address_or_ip }}:9000
    --fingerprint {{ certificates_fingerprint }}
  when: not ca_config_stat.stat.exists

- name: Create systemd service for certificate renewal
  ansible.builtin.copy:
    dest: /root/.provisioner-password
    mode: "0600"
    owner: root
    content: "{{ certificates_provisioner_password }}"
  notify: Restart SSH

- name: Ensure host is configured to use it's certs
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-step-host-cert.conf
    mode: "0644"
    owner: root
    content: |
      HostKey /etc/ssh/ssh_host_ecdsa_key
      HostCertificate /etc/ssh/ssh_host_ecdsa_key-cert.pub

- name: Check existing SSH host certificate
  ansible.builtin.shell: ssh-keygen -L -f /etc/ssh/ssh_host_ecdsa_key-cert.pub
  register: ssh_cert_info
  ignore_errors: true
  changed_when: false

- name: Set fact if certificate has correct principals
  ansible.builtin.set_fact:
    cert_has_principals: >-
      {{
        ssh_cert_info.stdout is search('Principals:\s*' ~ (ansible_facts['hostname'] | lower) ~ '\s*' ~ (ansible_facts['fqdn'] | lower))
      }}
  when: ssh_cert_info.rc == 0

- name: Check if SSH host certificate needs renewal
  ansible.builtin.command: step ssh needs-renewal /etc/ssh/ssh_host_ecdsa_key-cert.pub
  register: ssh_cert_renewal
  failed_when: ssh_cert_renewal.rc not in [0, 1]
  changed_when: false
  when: cert_has_principals | default(false)

- name: Generate SSH host certificate
  ansible.builtin.command: >
    step ssh certificate
    {{ ansible_facts['fqdn'] | lower }}
    /etc/ssh/ssh_host_ecdsa_key
    --principal {{ ansible_facts['hostname'] | lower }}
    --principal {{ ansible_facts['fqdn'] | lower }}
    --provisioner swage-jwk-provisioner
    --force --host --no-password --insecure
    --provisioner-password-file /root/.provisioner-password
  notify: Restart SSH
  when: not cert_has_principals | default(false) or ssh_cert_renewal.rc | default(1) == 0

- name: Create systemd service for certificate renewal
  ansible.builtin.copy:
    dest: /etc/systemd/system/step-ssh-renew.service
    mode: "0644"
    content: |
      [Unit]
      Description=Renew SSH host certificate using step

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/step ssh certificate {{ ansible_facts['fqdn'] | lower }} /etc/ssh/ssh_host_ecdsa_key \
        --principal {{ ansible_facts['hostname'] | lower }} \
        --principal {{ ansible_facts['fqdn'] | lower }} \
        --provisioner swage-jwk-provisioner \
        --force --host --no-password --insecure \
        --provisioner-password-file /root/.provisioner-password
      ExecStartPost=/bin/systemctl restart ssh

- name: Create systemd timer for daily 5am renewal
  ansible.builtin.copy:
    dest: /etc/systemd/system/step-ssh-renew.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Daily renewal of SSH host certificate at 5am

      [Timer]
      OnCalendar=*-*-* 05:00:00
      RandomizedDelaySec=1800
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: Enable and start step-ssh-renew timer
  ansible.builtin.systemd:
    name: step-ssh-renew.timer
    enabled: true
    state: started
