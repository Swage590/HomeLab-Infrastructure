- name: Ensure n8n project directory exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/n8n/"
    state: directory
    mode: "0755"

- name: Ensure n8n data directory exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/n8n/n8n_data"
    state: directory
    mode: "0755"
    owner: "1000"
    group: "1000"

- name: Ensure n8n local-files directory exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/n8n/local-files"
    state: directory
    mode: "0755"
    owner: "1000"
    group: "1000"

- name: Copy docker-compose.yaml for n8n
  ansible.builtin.template:
    src: "docker-compose.yaml.j2"
    dest: "/home/{{ ansible_user }}/n8n/docker-compose.yaml"
    mode: "0644"
  notify: Restart n8n

- name: Ensure n8n Docker Compose project is running
  community.docker.docker_compose_v2:
    project_src: "/home/{{ ansible_user }}/n8n/"
    state: present
    pull: always
