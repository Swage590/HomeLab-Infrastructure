- name: Ensure Ceph common utilities are installed (Debian)
  ansible.builtin.apt:
    name:
      - ceph-common
    state: present
  when: ansible_os_family == "Debian"

- name: Ensure Ceph utilities are installed via AUR (Arch Linux)
  kewlfft.aur.aur:
    use: yay
    name:
      - ceph-bin
    state: present
  become: true
  when: ansible_os_family == "Archlinux"

- name: Create Ceph configuration directory
  ansible.builtin.file:
    path: /etc/ceph
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create Ceph configuration file
  ansible.builtin.copy:
    dest: /etc/ceph/ceph.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [global]
      mon_host = {{ cephfs_endpoints }}

- name: Write Ceph secret file for sharedrive client
  no_log: true
  ansible.builtin.copy:
    dest: "/etc/ceph/ceph.client.{{ cephfs_sharedrive_name }}.secret"
    owner: root
    group: root
    mode: '0600'
    content: "{{ cephfs_sharedrive_client_key }}\n"

- name: Ensure mount point directory exists
  ansible.builtin.file:
    path: /mnt/{{ cephfs_sharedrive_name }}
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Reduce systemd default stop timeouts on VMs
  ansible.builtin.lineinfile:
    path: /etc/systemd/system.conf
    regexp: '^#?{{ item.key }}='
    line: '{{ item.key }}={{ item.value }}'
    state: present
  loop:
    - { key: 'DefaultTimeoutStopSec', value: '15s' }
    - { key: 'DefaultDeviceTimeoutSec', value: '10s' }

- name: Create systemd mount unit for CephFS
  become: true
  notify:
    - Reload systemd and start mount
  ansible.builtin.copy:
    dest: /etc/systemd/system/mnt-{{ cephfs_sharedrive_name }}.mount
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Mount CephFS {{ cephfs_sharedrive_name }} share
      DefaultDependencies=no
      Conflicts=umount.target
      Before=umount.target remote-fs.target
      After=network.target network-online.target systemd-networkd.service NetworkManager.service
      Wants=network-online.target

      [Mount]
      What={{ cephfs_sharedrive_name }}@.{{ cephfs_name }}=/{{ cephfs_sharedrive_name }}
      Where=/mnt/{{ cephfs_sharedrive_name }}
      Type=ceph
      Options=secretfile=/etc/ceph/ceph.client.{{ cephfs_sharedrive_name }}.secret,_netdev,abort_on_full
      TimeoutSec=15
      TimeoutCleanSec=10

      [Install]
      WantedBy=remote-fs.target multi-user.target
