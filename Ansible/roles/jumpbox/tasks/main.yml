---
- name: Install Ansible
  ansible.builtin.include_tasks: ansible-playbook.yaml

- name: Install Terraform
  ansible.builtin.include_tasks: terraform-playbook.yaml

- name: Install 1Password CLI
  ansible.builtin.include_tasks: 1password-cli-playbook.yaml

- name: Configure Git
  ansible.builtin.include_tasks: configure-git.yaml
  args:
    apply:
      become: false

- name: Configure SSH Known Hosts
  ansible.builtin.include_tasks: configure-ssh.yaml
  args:
    apply:
      become: false
