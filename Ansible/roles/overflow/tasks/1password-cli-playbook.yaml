---
- name: Install prerequisite packages for 1Password CLI
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - python3-debian
    state: present
    update_cache: yes

- name: Add 1Password repository
  ansible.builtin.deb822_repository:
    name: 1password
    types: [deb]
    uris: "https://downloads.1password.com/linux/debian/{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}"
    suites: [stable]
    components: [main]
    architectures:
      - "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}"
    signed_by: https://downloads.1password.com/linux/keys/1password.asc
    state: present

- name: Install 1Password CLI
  ansible.builtin.apt:
    name: 1password-cli
    state: present
    update_cache: yes
